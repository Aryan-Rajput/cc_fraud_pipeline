version: 2

sources:
  - name: staging
    database: CC_FRAUD_SILVER
    schema: STAGING
    tables:
      - name: raw_transactions
        description: "Raw credit card transactions loaded from S3 via Glue"

models:
  - name: stg_transactions
    description: "Cleaned, typed, incremental Silver staging model"
    columns:
      - name: trans_num
        description: "Unique transaction ID — primary key"
        data_tests:
          - unique
          - not_null
      - name: amount
        description: "Transaction amount in USD"
        data_tests:
          - not_null
          - name: amount_range_check
            test_name: dbt_utils.accepted_range
            arguments:
              min_value: 0
              max_value: 50000
      - name: is_fraud
        description: "Fraud label: 0 = legitimate, 1 = fraud"
        data_tests:
          - name: is_fraud_accepted_values
            test_name: accepted_values
            arguments:
              values:
                - 0
                - 1
      - name: category
        description: "Transaction category e.g. grocery_pos"
        data_tests:
          - not_null
      - name: transaction_at
        description: "Transaction timestamp"
        data_tests:
          - not_null